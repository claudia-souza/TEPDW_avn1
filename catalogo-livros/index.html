<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo seus Livros</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img
        src="src/assets/logo.png"
        alt="Pilha de livros coloridos"
        class="logo"
      />
      <div class="titulo-header">
        <h1>Catálogo de Livros</h1>
        <p>Organize os livros.</p>
      </div>
    </header>

    <main>
      <section class="painel">
        <h2>Cadastrar livro</h2>
        <form id="form-livro" novalidate>
          <div class="campo">
            <label for="titulo">Título</label>
            <input
              type="text"
              id="titulo"
              placeholder="Ex.: A Hora da Estrela"
            />
            <span class="erro" id="erro-titulo"></span>
          </div>

          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="">Selecione...</option>
              <option value="Ficção">Ficção Científica</option>
              <option value="Fantasia">Fantasia</option>
              <option value="Terror">Terror</option>
              <option value="Drama">Drama</option>
              <option value="Romance">Romance</option>
              <option value="Aventura">Aventura</option>
              <option value="Distopia">Distopia</option>
              <option value="Academicos">Academicos</option>
              <option value="Infantil">Literatura Infantil</option>
              <option value="Quadrinhos">Quadrinhos</option>
              <option value="Outros">Outros</option>
            </select>
            <span class="erro" id="erro-categoria"></span>
          </div>

          <div class="campo">
            <label for="autor">Autor</label>
            <input
              type="text"
              id="autor"
              placeholder="Ex.:Clarice Lispector "
            />
            <span class="erro" id="erro-autor"></span>
          </div>

          <div class="campo">
            <label for="ano">Ano de publicação</label>
            <input type="number" id="ano" placeholder="Ex.: 1899" />
            <span class="erro" id="erro-ano"></span>
          </div>

          <div class="campo campo-check">
            <input type="checkbox" id="lido" />
            <label for="lido">Já li este livro</label>
          </div>

          <button type="submit">Adicionar</button>
        </form>
      </section>

      <section class="painel">
        <h2>Buscar e filtrar</h2>
        <div class="filtros">
          <input type="search" id="busca" placeholder="Buscar pelo título..." />
          <select id="filtro-categoria">
            <option value="">Todas as categorias</option>
            <option value="Ficção">Ficção Científica</option>
            <option value="Fantasia">Fantasia</option>
            <option value="Terror">Terror</option>
            <option value="Drama">Drama</option>
            <option value="Romance">Romance</option>
            <option value="Aventura">Aventura</option>
            <option value="Distopia">Distopia</option>
            <option value="Academicos">Academicos</option>
            <option value="Infantil">Literatura Infantil</option>
            <option value="Quadrinhos">Quadrinhos</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
      </section>

      <section>
        <h2>Meus livros</h2>
        <p id="mensagem-vazio" class="vazio" hidden></p>
        <ul id="lista" class="cards"></ul>
      </section>

      <h2>Resumo do catálogo</h2>
      <section class="resumo" aria-label="Resumo do catálogo">
        <div class="resumo-item">
          <span id="total">0</span><small>Total</small>
        </div>
        <div class="resumo-item">
          <span id="lidos">0</span><small>Lidos</small>
        </div>
        <div class="resumo-item">
          <span id="nao-lidos">0</span><small>Não lidos</small>
        </div>
      </section>
    </main>

    <script src="dist/main.js"></script>
  </body>
</html>
